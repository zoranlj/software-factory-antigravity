name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Software Factory Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate shell & Node script syntax
        run: |
          bash -n install.sh tests/factory-verify.sh factory/scripts/*.sh
          node --check factory/scripts/*.mjs

      - name: Run End-to-End Verification Suite
        run: ./tests/factory-verify.sh
